<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>avgo — game</title>
<link rel="stylesheet" href="/static/avgo.css">
</head>
<body>
  <main class="table">
    <div class="board-frame">
      <canvas class="board" id="board" width="560" height="560"></canvas>
    </div>

    <aside class="side">
      <div class="seats" id="seats" hidden>
        <span class="seat" id="seatBlack">
          <i class="stone"></i>
          <span class="seat-name"></span>
          <span class="seat-you"></span>
          <span class="seat-captures" title="stones captured"></span>
        </span>
        <span class="seat" id="seatWhite">
          <i class="stone stone-white"></i>
          <span class="seat-name"></span>
          <span class="seat-you"></span>
          <span class="seat-captures" title="stones captured"></span>
        </span>
      </div>

      <p class="center" id="status">Loading&hellip;</p>

      <div class="row">
        <button class="btn" id="pass" disabled>Pass</button>
        <span class="meta" id="score"></span>
        <button class="btn btn-icon" id="mute" type="button"
                aria-pressed="false" title="Mute sounds" aria-label="Mute sounds">
          <svg viewBox="0 0 20 16" width="18" height="16" aria-hidden="true">
            <path d="M3 6h3l4-3.5v11L6 10H3z" fill="currentColor"/>
            <g id="muteWaves" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round">
              <path d="M13 5.5a4 4 0 0 1 0 5"/>
              <path d="M15.5 3.5a7.5 7.5 0 0 1 0 9"/>
            </g>
            <g id="muteCross" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" hidden>
              <path d="M13.5 5.5l4 5M17.5 5.5l-4 5"/>
            </g>
          </svg>
        </button>
      </div>

      <div class="row" id="inviteRow" hidden>
        <input class="field" id="invite" readonly aria-label="Invite link">
        <button class="btn" id="copy">Copy link</button>
      </div>

      <form class="row" id="joinForm" hidden>
        <input class="field" id="joinName" maxlength="24" required
               autocomplete="nickname" placeholder="Your name">
        <button class="btn btn-primary" type="submit">Join game</button>
      </form>

      <section class="chat" id="chat" hidden>
        <ul class="chat-log" id="chatLog"></ul>
        <p class="muted center chat-empty" id="chatEmpty">No messages yet.</p>
        <!-- One field and no button: Enter submits the form on its own. -->
        <form id="chatForm" hidden>
          <input class="field chat-input" id="chatText" maxlength="200" required
                 autocomplete="off" placeholder="Message">
        </form>
      </section>

      <p class="error center" id="error"></p>
    </aside>
  </main>

  <script src="/static/game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>avgo — Go</title>
<link rel="stylesheet" href="/static/avgo.css">
</head>
<body>
  <header class="masthead">
    <h1 class="brand">Go</h1>
    <p class="tagline">9&times;9. Create a game, send the link to one other person, and play.</p>
  </header>

  <main class="card">
    <form class="stack" id="create">
      <div class="row">
        <input class="field" id="name" name="name" maxlength="24" required
               autocomplete="nickname" autofocus placeholder="Your name">
        <button class="btn btn-primary" type="submit">Create game</button>
      </div>
      <p class="error center" id="error"></p>
    </form>
  </main>

  <script src="/static/lobby.js"></script>
</body>
</html>
